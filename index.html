<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Track Fast Design - Template Orçamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="tf-page">
    <section class="tf-card">
    
      <!-- GRID DE THUMBNAILS (4 imagens de portfólio) -->
      <div class="tf-thumbnails-grid">
        <img src="assets/images/thumbnail1.png" alt="Projeto 1" class="tf-thumbnail" />
        <img src="assets/images/thumbnail2.png" alt="Projeto 2" class="tf-thumbnail" />
        <img src="assets/images/thumbnail3.png" alt="Projeto 3" class="tf-thumbnail" />
        <img src="assets/images/thumbnail4.png" alt="Projeto 4" class="tf-thumbnail" />
      </div>
    
      <!-- GRUPO: ONDA-LOGO + ASSINATURA -->
      <div class="tf-bottom-group">
      
        <!-- ELEMENTO ONDA-LOGO -->
        <div class="tf-onda-container">
          <img src="assets/images/onda-logo.png" alt="Track Fast Design Onda" class="tf-onda-logo" />
        </div>

        <!-- ELEMENTO ASSINATURA VERTICAL -->
        <div class="tf-assinatura-container">
          <img src="assets/images/assinatura.png" alt="Assinatura Track Fast Design" class="tf-assinatura" />
        </div>

      </div>

    </section>
  </main>
</body>
</html>
