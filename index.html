<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Track Fast Design - Template Orçamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="tf-page">
    <section class="tf-card">
      
      <!-- GRUPO: ONDA-LOGO + ASSINATURA (centralizados juntos) -->
      <div class="tf-bottom-group">
        
        <!-- ELEMENTO ONDA-LOGO -->
        <div class="tf-wave-container">
          <img src="assets/images/onda-logo.png" alt="Track Fast Design Wave" class="tf-wave-logo" />
        </div>

        <!-- ELEMENTO ASSINATURA VERTICAL -->
        <div class="tf-signature-container">
          <img src="assets/images/assinatura.png" alt="Assinatura Track Fast Design" class="tf-signature" />
        </div>

      </div>

    </section>
  </main>
</body>
</html>
