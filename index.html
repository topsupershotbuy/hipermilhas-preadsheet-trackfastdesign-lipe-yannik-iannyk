<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Track Fast Design - Template Orçamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- CONTAINER EXTERNO (SIMULA A PRANCHA ROSA DO DEMO) -->
  <main class="tf-page">
    <section class="tf-card">

      <!-- BOTÃO DOWNLOAD (uso futuro de hyperlink) -->
      <header class="tf-header">
        <button class="tf-download-btn">
          DOWNLOAD
        </button>
      </header>

      <!-- ÁREA CENTRAL DO TEMPLATE -->
      <section class="tf-content">

        <!-- FAIXA COM GRADIENTE + LOGO (onda-assinatura-logo.png) -->
        <div class="tf-wave-strip">
          <img
            src="onda-assinatura-logo.png"
            alt="Track Fast Design - Onda Assinatura"
            class="tf-wave-img"
          />
        </div>

        <!-- COLUNA VERTICAL COM ARTE LATERAL (recortada da própria onda-assinatura-logo.png) -->
        <aside class="tf-side-art">
          <!--
            Por enquanto usamos o mesmo arquivo de onda,
            a arte lateral definitiva pode ser atualizada depois
            (mantendo a mesma estrutura HTML).
          -->
          <img
            src="onda-assinatura-logo.png"
            alt="Arte lateral Track Fast Design"
            class="tf-side-art-img"
          />
        </aside>

        <!-- MINI-GRADE DE THUMBNAILS (template1/2/3/4) -->
        <div class="tf-thumbs-wrapper">
          <div class="tf-thumb">
            <img src="template1.png" alt="Coleção de templates 1" />
          </div>
          <div class="tf-thumb">
            <img src="template2.png" alt="Coleção de templates 2" />
          </div>
          <div class="tf-thumb">
            <img src="template3.png" alt="Coleção de templates 3" />
          </div>
          <div class="tf-thumb">
            <img src="template4.png" alt="Coleção de templates 4" />
          </div>
        </div>
      </section>

      <!-- RODAPÉ RESERVADO (se precisar inserir textos de orçamento depois) -->
      <footer class="tf-footer">
        <!-- Espaço reservado para informações de orçamento do cliente HM -->
      </footer>

    </section>
  </main>
</body>
</html>
